[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nepalpay"
version = "1.0.0"
description = "Universal, zero-dependency payment SDK for Nepal (eSewa, Khalti, ConnectIPS, IME Pay, NepalQR) for Python, FastAPI, and Django"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ranjeet Kumar Sah", email = "ranjeet2063@users.noreply.github.com"}
]
keywords = [
    "nepal",
    "payment",
    "esewa",
    "khalti",
    "connectips",
    "imepay",
    "fonepay",
    "nepalqr",
    "fastapi",
    "django"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
    "Typing :: Typed"
]
dependencies = []

[project.scripts]
nepalpay = "nepalpay.cli:main"

[project.urls]
Homepage = "https://github.com/Ranjeet2063/nepalpay-py"
Repository = "https://github.com/Ranjeet2063/nepalpay-py"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
